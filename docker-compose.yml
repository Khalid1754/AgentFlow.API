# Startar hela AgentFlow: SQL Server, .NET-API:t och React-frontenden.
#   docker compose up -d --build   (eller dubbelklicka på start.bat i Windows)
# Appen: http://localhost:8090  ·  SQL Server (för SSMS): localhost,1434 med användare sa
# Portarna skiljer sig från TrAInr så att båda kan köras samtidigt.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-AgentFlow_Dev123!}"
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend/AgentFlow.Api
    restart: unless-stopped
    environment:
      ConnectionStrings__AgentFlow: "Server=sqlserver,1433;Database=AgentFlow;User Id=sa;Password=${SA_PASSWORD:-AgentFlow_Dev123!};TrustServerCertificate=True"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      Groq__Model: "${GROQ_MODEL:-openai/gpt-oss-120b}"
    ports:
      - "5098:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  sqldata:
