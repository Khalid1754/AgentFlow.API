server {
    listen 80;
    root /usr/share/nginx/html;

    # Anrop till /api skickas vidare till .NET-backenden i containern "api".
    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 600s;
        # Server-Sent Events: skicka varje händelse direkt i stället för att samla ihop dem.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }
}
