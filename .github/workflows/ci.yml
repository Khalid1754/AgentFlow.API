# Kör alla tester på varje pull request och varje push till main.
name: Tester

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tester
        run: dotnet test AgentFlow.slnx --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: Typkontroll och bygge
        run: npm run build

  docker:
    name: Docker-bygge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg containrarna
        run: docker compose build
